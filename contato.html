<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>
  
  <!-- Bootstrap 5 CSS (Necessário para a estrutura do menu e utilitários) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Seu arquivo de estilos CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra Superior (Navbar) -->
  <header>
    <nav class="navbar navbar-expand-lg bg-custom-bar navbar-dark py-2">
      <div class="container">
        <!-- Logo e Nome -->
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="https://via.placeholder.com/70" alt="Logo" class="d-inline-block align-text-top">
          <span class="fonte-alex-brush">Sua Marca</span>
        </a>

        <!-- Botão Menu Mobile (Hambúrguer) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links de Navegação -->
        <div class="collapse navbar-collapse justify-content-end" id="menuNavegacao">
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Sobre</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Serviços</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container my-5">
    <div class="row">
      <div class="col-12 text-center">
        <h1>Bem-vindo ao Nosso Site</h1>
        <p class="lead">Estrutura inicial alinhada com as cores e variáveis do seu CSS.</p>
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="bg-custom-bar text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 <span class="fonte-alex-brush fs-4">Sua Marca</span>. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JavaScript Bundle (Necessário para abrir o menu mobile) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
