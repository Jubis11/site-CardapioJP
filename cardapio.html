<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Cardápio - Juvenal Parada</title>

  <!-- Google Fonts: Fonte Alex Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Seu CSS Personalizado -->
  <link rel="stylesheet" href="cardapio.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar / Cabeçalho -->
  <nav class="navbar navbar-expand-lg bg-custom-bar navbar-dark py-2">
    <div class="container">
      
      <!-- Logo + Nome -->
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="img/" alt="Logo Juvenal Parada" onerror="this.style.display='none'">
        <span class="fonte-alex-brush">Juvenal Parada</span>
      </a>

      <!-- Botão Mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menus de Navegação -->
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-3 text-uppercase align-items-lg-center mt-3 mt-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">INÍCIO</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="cardapio.html">CARDÁPIO</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="bootstrap.html">BOOTSTRAP</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="container my-5">
    <div class="text-center mb-4">
      <h1 class="fw-bold" style="color: var(--cor-barra); font-size: 2rem;">Nosso Cardápio</h1>
      <p class="text-muted small">Uma seleção de pratos e porções para todos os gostos</p>
    </div>

    <!-- Botões de Categoria -->
    <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
      <button class="btn btn-categoria active text-uppercase" data-categoria="porcoes">PORÇÕES</button>
      <button class="btn btn-categoria text-uppercase" data-categoria="sanduiches">SANDUÍCHES</button>
      <button class="btn btn-categoria text-uppercase" data-categoria="pratos">PRATOS</button>
      <button class="btn btn-categoria text-uppercase" data-categoria="bebidas">BEBIDAS</button>
    </div>

    <!-- Container onde o JavaScript injeta os cards dinamicamente -->
    <div class="row g-4" id="grid-cardapio"></div>
  </main>

  <!-- Rodapé -->
  <footer class="bg-custom-bar text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 small">Juvenal Parada &copy; 2026 - Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Conexão do arquivo JavaScript -->
  <script src="cardapio.js"></script>
</body>
</html>
