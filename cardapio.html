<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Cardápio - Juvenal Parada</title>

  <!-- Google Fonts: Fonte Alex Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Seu CSS Personalizado -->
  <link rel="stylesheet" href="cardapio.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header / Navbar Padronizada -->
  <header class="bg-custom-bar py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center text-decoration-none">
        <span class="fonte-alex-brush">Juvenal Parada</span>
      </a>
      <nav class="d-flex align-items-center gap-4">
        <a href="index.html" class="nav-link-custom">INÍCIO</a>
        <a href="cardapio.html" class="nav-link-custom active">CARDÁPIO</a>
        <a href="bootstrap.html" class="nav-link-custom">BOOTSTRAP</a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container my-5 flex-grow-1">
    <div class="text-center mb-4">
      <h1 class="fw-bold" style="color: var(--cor-barra); font-size: 2rem;">Nosso Cardápio</h1>
      <p class="text-muted small">Uma seleção de pratos e porções para todos os gostos</p>
    </div>

    <!-- Botões de Categoria -->
    <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
      <button class="btn btn-categoria active text-uppercase" data-categoria="porcoes">PORÇÕES</button>
      <button class="btn btn-categoria text-uppercase" data-categoria="sanduiches">SANDUÍCHES</button>
      <button class="btn btn-categoria text-uppercase" data-categoria="pratos">PRATOS</button>
      <button class="btn btn-categoria text-uppercase" data-categoria="bebidas">BEBIDAS</button>
    </div>

    <!-- Container onde o JavaScript injeta os cards dinamicamente -->
    <div class="row g-4" id="grid-cardapio"></div>
  </main>

  <!-- Rodapé -->
  <footer class="bg-custom-bar text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 small">Juvenal Parada &copy; 2026 - Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Conexão do arquivo JavaScript -->
  <script src="cardapio.js"></script>
</body>
</html>
